[project]
name = "genes"
version = "0.1.0"
description = "genes.pietri.dev: species of the pietri.dev world, real biology and painted 3D models."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "jsonschema>=4.25",
]

[project.scripts]
genes = "genes.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.17",
    "numpy>=2",
    "pillow>=11",
    "playwright>=1.55",
    "pytest>=8.4",
    "ruff>=0.12",
    "types-jsonschema>=4.25",
]
# Blender as a Python module, for the plant generator (phase 2). Never installed by default;
# nothing outside tools/blender/ imports it.
blender = [
    "bpy==5.3.0",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genes"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
allowed-confusables = ["–", "×", "−"]

[tool.mypy]
python_version = "3.13"
packages = ["genes", "plant"]
mypy_path = "src:tools/blender"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["bpy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools/blender"]
